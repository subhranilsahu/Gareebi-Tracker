<!DOCTYPE html>
<!-- Standard HTML5 document declaration -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Gareebi Tracker</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets: Global variables first, then dedicated Auth styling -->
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body class="auth-body">

    <!-- ===================================================================== -->
    <!-- AUTHENTICATION WRAPPER (Centered Card Container)                       -->
    <!-- ===================================================================== -->
    <main class="auth-container">
        
        <!-- Back Navigation to Landing Page -->
        <a href="landing.html" class="auth-back-link">
            <span>←</span> Back to home
        </a>

        <div class="auth-card">
            
            <!-- Card Branding Header -->
            <div class="auth-header">
                <a href="landing.html" class="auth-brand">
                    <span class="brand-text">Gareebi<span class="brand-accent">Tracker</span></span>
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Log in to check your balances and recent spends.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                
                <!-- Email Field -->
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com" 
                        autocomplete="email"
                        required
                    >
                    <span class="field-error-msg" id="login-email-error"></span>
                </div>

                <!-- Password Field with Show/Hide Toggle -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="login-password" class="form-label">Password</label>
                        <a href="#" class="forgot-link" tabindex="-1">Forgot?</a>
                    </div>
                    <div class="input-password-wrapper">
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
                            <span class="toggle-icon"><svg class="toggle-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="3"/>
</svg></span>
                        </button>
                    </div>
                    <span class="field-error-msg" id="login-password-error"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-auth-submit">
                    Sign In to Dashboard
                </button>

            </form>

            <!-- Card Footer Switcher -->
            <div class="auth-footer">
                <p>Don't have an account yet? <a href="signup.html" class="auth-switch-link">Sign up</a></p>
            </div>

        </div>

        <p class="auth-disclaimer">Track your money before it tracks you.</p>

    </main>

    <!-- Client-side Validation Script -->
    <script src="../static/js/auth.js"></script>
</body>
</html>
