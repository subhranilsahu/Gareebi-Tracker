<!DOCTYPE html>
<!-- Standard HTML5 document declaration -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Gareebi Tracker 💸</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets: Global variables first, then dedicated Auth styling -->
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body class="auth-body">

    <!-- ===================================================================== -->
    <!-- AUTHENTICATION WRAPPER (Centered Card Container)                       -->
    <!-- ===================================================================== -->
    <main class="auth-container">
        
        <!-- Back Navigation to Landing Page -->
        <a href="landing.html" class="auth-back-link">
            <span>←</span> Back to home
        </a>

        <div class="auth-card">
            
            <!-- Card Branding Header -->
            <div class="auth-header">
                <a href="landing.html" class="auth-brand">
                    <span class="brand-emoji">💸</span>
                    <span class="brand-text">Gareebi<span class="brand-accent">Tracker</span></span>
                </a>
                <h1 class="auth-title">Create an account</h1>
                <p class="auth-subtitle">Start taking control of your daily cash & bank balance.</p>
            </div>

            <!-- Registration Form -->
            <form id="signup-form" class="auth-form" novalidate>
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="signup-name" 
                        name="name" 
                        class="form-input" 
                        placeholder="Abhigyan Das" 
                        autocomplete="name"
                        required
                    >
                    <span class="field-error-msg" id="signup-name-error"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="signup-email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="signup-email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com" 
                        autocomplete="email"
                        required
                    >
                    <span class="field-error-msg" id="signup-email-error"></span>
                </div>

                <!-- Password Field with Show/Hide Toggle -->
                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <div class="input-password-wrapper">
                        <input 
                            type="password" 
                            id="signup-password" 
                            name="password" 
                            class="form-input" 
                            placeholder="At least 8 characters" 
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
                            <span class="toggle-icon">👁️</span>
                        </button>
                    </div>
                    <span class="field-error-msg" id="signup-password-error"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-auth-submit">
                    Create Account
                </button>

            </form>

            <!-- Card Footer Switcher -->
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-switch-link">Log in</a></p>
            </div>

        </div>

        <p class="auth-disclaimer">⚡ Zero spam. Your credentials stay strictly private.</p>

    </main>

    <!-- Client-side Validation Script -->
    <script src="../static/js/auth.js"></script>
</body>
</html>
